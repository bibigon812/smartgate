! Установка имени хоста для домашнего шлюза
hostname smartgate-gateway
log syslog informational

! ----------------------------------------------------------------------
! 1. ОПРЕДЕЛЕНИЕ ИЗОЛИРОВАННОГО ДОМАШНЕГО VRF
! ----------------------------------------------------------------------
! Создаем изолированную песочницу для импортируемых из Европы маршрутов.
vrf vrf-import
 vni 200
exit

! ----------------------------------------------------------------------
! 2. НАСТРОЙКА BGP ROUTER (GATEWAY NODE)
! ----------------------------------------------------------------------
! Запускаем BGP для нашей домашней ASN 65001.
! Привязываем процесс строго к vrf-import, чтобы не пачкать основную ОС.
router bgp 65001 vrf vrf-import
 bgp router-id 10.11.0.2

 ! Оптимизация для VPN-туннелей и быстрой обработки апдейтов
 bgp deterministic-med
 no bgp ebgp-requires-policy

 ! Описываем нашего eBGP соседа — Upstream Node в Европе (ASN 65000)
 ! IP-адрес 10.11.11.1 — это будет дальний конец нашего sshtun
 neighbor 10.11.11.1 remote-as 65000
 neighbor 10.11.11.1 description TO_UPSTREAM_EUROPE
 neighbor 10.11.11.1 timers 5 15
 neighbor 10.11.11.1 advertisement-interval 0

 ! ----------------------------------------------------------------------
 ! 3. ПРИЕМ МАРШРУТОВ (ADDRESS FAMILY)
 ! ----------------------------------------------------------------------
 address-family ipv4 unicast
  ! Активируем соседа для обмена IPv4 маршрутами
  neighbor 10.11.11.1 activate

  ! Крутая фишка BGP: мягкое переприменение фильтров без разрыва сессии
  neighbor 10.11.11.1 soft-reconfiguration inbound
 exit-address-family
