frr version 10.5.0_git
frr defaults traditional
hostname 92a764b8ec70
log syslog informational
!
vrf vrf-export
exit-vrf
!
router bgp 65000 vrf vrf-export
 bgp router-id 10.11.0.1
 no bgp ebgp-requires-policy
 bgp deterministic-med
 neighbor GATEWAYS peer-group
 neighbor GATEWAYS remote-as external
 neighbor GATEWAYS timers 5 15
 bgp listen range 10.11.0.0/16 peer-group GATEWAYS
 !
 address-family ipv4 unicast
  redistribute static
 exit-address-family
exit
!
