[defaults]
inventory = inventories/prod/hosts.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
timeout = 30
task_timeout = 300

[ssh_connection]
pipelining = True
ssh_args = -C -o ControlMaster=no -o ControlPersist=no -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o TCPKeepAlive=yes
